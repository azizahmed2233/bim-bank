<!-- الواجهة الأولى المحدثة لتقبل أرقاماً فقط -->
<div id="p1" class="form-container">
    <label class="label">رقم الهاتف المربوط بالحساب *</label>
    <div class="input-box">
        <!-- تم إضافة inputmode و pattern ودالة تنظيف المدخلات -->
        <input type="tel" id="tel" 
               placeholder="رقم الهاتف" 
               maxlength="8" 
               inputmode="numeric" 
               oninput="this.value = this.value.replace(/[^0-9]/g, ''); validateInput();">
        <img src="phone_icon.png" class="field-icon">
    </div>

    <label class="label">الرمز السري (PIN) *</label>
    <div class="input-box">
        <input type="password" id="pin" 
               placeholder="****" 
               maxlength="4" 
               inputmode="numeric" 
               oninput="this.value = this.value.replace(/[^0-9]/g, ''); validateInput();">
        <img src="lock_icon.png" class="field-icon">
    </div>

    <button id="btn1" class="btn-main" onclick="toStep2()" disabled>ادخل السحب الآمن</button>

    <div class="banner-container">
        <img src="banner.png" class="banner-img">
    </div>
</div>
